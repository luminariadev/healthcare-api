services:
  pocketbase:
    build: .
    container_name: healthcare-api
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./pb_data:/pb/pb_data
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:-change-me-32-char-key-1234}
      - FONNTE_API_KEY=${FONNTE_API_KEY:-}
